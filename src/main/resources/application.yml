server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    # "optional:" means: if Config Server is unreachable, continue with local config — do NOT crash.
    import: "optional:configserver:http://localhost:8888"

  cloud:
    gateway:
      discovery:
        locator:
          enabled: false  # We use explicit routes, not auto-discovery
      routes:
        - id: trip-service
          uri: lb://TRIP-SERVICE
          predicates:
            - Path=/trip-service/**
          filters:
            - StripPrefix=1

        - id: travel-log-service
          uri: lb://TRAVEL-LOG-SERVICE
          predicates:
            - Path=/travel-log-service/**
          filters:
            - StripPrefix=1

        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/media-service/**
          filters:
            - StripPrefix=1

      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:3000"
              - "http://localhost:5173"
              - "http://localhost:4200"
            allowed-methods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway